name: Package & Release

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build-test-package:
    runs-on: windows-latest

    env:
      VCPKG_ROOT: C:\vcpkg
      TRIPLET: x64-windows
      VCPKG_INSTALLED_DIR: ${{ github.workspace }}/vcpkg_installed

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#v}"
            # Validate semver format
            if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Invalid version tag format: $TAG (expected vMAJOR.MINOR.PATCH)"
              exit 1
            fi
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "is_release=true" >> $GITHUB_OUTPUT
            echo "artifact_name=SoapySDR-for-MATLAB-$VERSION" >> $GITHUB_OUTPUT
          else
            echo "version=" >> $GITHUB_OUTPUT
            echo "is_release=false" >> $GITHUB_OUTPUT
            echo "artifact_name=SoapySDR-for-MATLAB-dev" >> $GITHUB_OUTPUT
          fi

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: a2b75031b909a2d6b051725c3909230c72d4bd4a

      - name: Install vcpkg dependencies
        run: vcpkg install --triplet ${{ env.TRIPLET }}

      - name: Build fake Soapy module
        run: |
          cmake -B build/test-driver -S test/soapy `
            -DCMAKE_TOOLCHAIN_FILE="${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=${{ env.TRIPLET }} `
            -DVCPKG_INSTALLED_DIR="${{ github.workspace }}/vcpkg_installed" `
            -DVCPKG_MANIFEST_DIR="${{ github.workspace }}"
          cmake --build build/test-driver --config Release

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          release: R2026a

      - name: Configure runtime paths
        run: |
          echo "SOAPY_SDR_PLUGIN_PATH=${{ github.workspace }}\build\test-driver\Release" >> $env:GITHUB_ENV
          echo "${{ github.workspace }}\vcpkg_installed\x64-windows\bin" >> $env:GITHUB_PATH

      - name: Build and package
        uses: matlab-actions/run-command@v2
        env:
          VCPKG_INSTALLED_DIR: ${{ github.workspace }}/vcpkg_installed
          TOOLBOX_VERSION: ${{ steps.version.outputs.version }}
        with:
          command: buildtool package

      - name: Smoke test
        uses: matlab-actions/run-command@v2
        env:
          TOOLBOX_VERSION: ${{ steps.version.outputs.version }}
        with:
          command: run('toolbox/smokeTest.m')

      - name: Upload artifact
        if: github.event_name == 'push' && steps.version.outputs.is_release == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.artifact_name }}
          path: artifacts/*.mltbx

      - name: Create GitHub Release
        if: steps.version.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*.mltbx
